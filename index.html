<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111418">
<title>Balance Tracker</title>
<style>
  :root {
    --bg: #f4f5f7; --card: #fff; --text: #15181d; --muted: #6b7280; --border: #e3e5e9;
    --accent: #2563eb; --pos: #15803d; --neg: #b91c1c; --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1e24; --text: #e8eaed; --muted: #9aa1ab; --border: #2a2f37;
      --accent: #4f8cff; --pos: #4ade80; --neg: #f87171; --chip: #232830;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  header h1 { font-size: 18px; margin: 0; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; }
  .balance { text-align: center; padding: 28px 16px; }
  .balance .label { color: var(--muted); font-size: 14px; }
  .balance .amount { font-size: 44px; font-weight: 700; margin: 6px 0; font-variant-numeric: tabular-nums; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  button {
    font: inherit; border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 10px 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.big { width: 100%; padding: 14px; margin-top: 12px; font-size: 17px; }
  button.link { border: none; background: none; color: var(--muted); padding: 6px; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 24px 4px 8px; }
  .tx { display: flex; gap: 12px; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--border); }
  .tx:first-child { border-top: none; }
  .tx .title { font-weight: 600; }
  .tx .meta { color: var(--muted); font-size: 13px; }
  .tx .right { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tx .del { font-size: 12px; color: var(--muted); border: none; background: none; padding: 2px 0; }
  .chip { display: inline-block; background: var(--chip); border-radius: 6px; padding: 1px 6px; font-size: 12px; margin-right: 4px; }
  .empty { color: var(--muted); text-align: center; padding: 16px 0; }

  dialog {
    width: min(520px, calc(100vw - 32px)); border: 1px solid var(--border); border-radius: 16px;
    background: var(--card); color: var(--text); padding: 0;
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  .dlg { padding: 16px; }
  .dlg h3 { margin: 0 0 12px; }
  .seg { display: flex; background: var(--chip); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
  .seg button { flex: 1; border: none; background: none; padding: 8px 4px; font-size: 14px; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 2px rgba(0,0,0,.15); font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select {
    width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
  }
  .row { display: flex; gap: 10px; } .row > div { flex: 1; min-width: 0; }
  .preview { margin-top: 14px; padding: 10px 12px; background: var(--chip); border-radius: 10px; font-size: 14px; }
  .actions { display: flex; gap: 10px; margin-top: 16px; } .actions button { flex: 1; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  [hidden] { display: none !important; }
  .auth { max-width: 380px; margin: 12vh auto 0; }
  .err { color: var(--neg); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .loading { opacity: .5; pointer-events: none; }
  .report {
    white-space: pre-wrap; font: 15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: var(--chip); border-radius: 10px; padding: 12px; margin: 0;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
</head>
<body>
<main id="authView" hidden>
  <form class="card auth" id="authForm">
    <h3 style="margin:0 0 4px">Balance Tracker</h3>
    <div class="hint">Sign in to continue.</div>
    <label for="email">Email</label>
    <input id="email" type="email" autocomplete="email" required>
    <label for="password">Password</label>
    <input id="password" type="password" autocomplete="current-password" minlength="6" required>
    <div class="err" id="authErr"></div>
    <div class="actions">
      <button type="button" id="signUpBtn">Create account</button>
      <button type="submit" class="primary">Sign in</button>
    </div>
  </form>
</main>

<main id="appView" hidden>
  <header>
    <h1>Balance Tracker</h1>
    <button class="link" id="settingsBtn">Settings</button>
  </header>

  <section class="card balance">
    <div class="label" id="balLabel">Balance</div>
    <div class="amount" id="balAmount">$0.00</div>
    <div class="label" id="balSub"></div>
    <button class="primary big" id="addBtn">+ Add transaction</button>
  </section>

  <h2>Transactions</h2>
  <section class="card" id="txList"></section>
</main>

<!-- Add transaction -->
<dialog id="txDlg">
  <form class="dlg" id="txForm" method="dialog">
    <h3>Add transaction</h3>
    <div class="seg" id="typeSeg">
      <button type="button" data-type="pickup" class="on">Pickup</button>
      <button type="button" data-type="action">Action</button>
      <button type="button" data-type="generic">Generic</button>
    </div>

    <div data-for="pickup">
      <label for="pCasino">Casino</label>
      <input id="pCasino" list="casinos" autocomplete="off">
      <label for="pIdentity">Identity</label>
      <input id="pIdentity" list="identities" autocomplete="off">
      <div class="row">
        <div><label for="pAmount">Pickup amount</label><input id="pAmount" type="number" inputmode="decimal" step="0.01" min="0"></div>
        <div><label for="pPct">My %</label><input id="pPct" type="number" inputmode="decimal" step="0.01" min="0" max="100"></div>
      </div>
    </div>

    <div data-for="action" hidden>
      <div class="seg" id="sideSeg" style="margin-bottom:0">
        <button type="button" data-side="bought" class="on">I bought action</button>
        <button type="button" data-side="sold">I sold action</button>
      </div>
      <div class="row">
        <div><label for="aCasino">Casino (optional)</label><input id="aCasino" list="casinos" autocomplete="off"></div>
        <div><label for="aGame">Game (optional)</label><input id="aGame" autocomplete="off"></div>
      </div>
      <div class="row">
        <div><label for="aResult">Result (+win / −loss)</label><input id="aResult" type="number" inputmode="decimal" step="0.01"></div>
        <div><label for="aPct">My %</label><input id="aPct" type="number" inputmode="decimal" step="0.01" min="0" max="100"></div>
      </div>
      <div class="hint" id="actionHint"></div>
    </div>

    <div data-for="generic" hidden>
      <label for="gDesc">Description</label>
      <input id="gDesc" autocomplete="off">
      <label for="gAmount">Amount</label>
      <input id="gAmount" type="number" inputmode="decimal" step="0.01" min="0">
      <div class="seg" id="dirSeg" style="margin:10px 0 0">
        <button type="button" data-dir="1" class="on">I owe them</button>
        <button type="button" data-dir="-1">They owe me</button>
      </div>
    </div>

    <label for="tDate">Date</label>
    <input id="tDate" type="date">

    <div class="preview" id="preview"></div>
    <div class="actions">
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary" id="saveTx">Save</button>
    </div>
  </form>
</dialog>

<!-- Settings -->
<dialog id="setDlg">
  <form class="dlg" method="dialog">
    <h3>Settings</h3>
    <div class="row">
      <div><label for="sMyName">Your name</label><input id="sMyName" placeholder="Me"></div>
      <div><label for="sName">Other person's name</label><input id="sName" placeholder="Them"></div>
    </div>
    <div class="hint">Reports use initials, e.g. "Josh McClain" or "jm" → jm.</div>
    <label for="sPct">Default my %</label>
    <input id="sPct" type="number" inputmode="decimal" step="0.01" min="0" max="100">
    <label>Backup</label>
    <div class="row">
      <div><button type="button" id="exportBtn" style="width:100%">Export JSON</button></div>
      <div><button type="button" id="importBtn" style="width:100%">Import JSON</button></div>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
    <div class="hint">Data is synced to Supabase. Import adds the file's transactions to your existing ones.</div>
    <div class="actions">
      <button type="button" id="signOutBtn">Sign out</button>
      <button type="submit" class="primary" id="saveSettings">Done</button>
    </div>
  </form>
</dialog>

<!-- Saved confirmation -->
<dialog id="doneDlg">
  <form class="dlg" method="dialog">
    <h3>Transaction saved</h3>
    <pre class="report" id="reportText"></pre>
    <div class="actions">
      <button type="button" id="copyBtn">Copy report</button>
      <button type="submit" class="primary">Done</button>
    </div>
  </form>
</dialog>

<datalist id="casinos"></datalist>
<datalist id="identities"></datalist>

<script>
const SUPABASE_URL = 'https://deypqofvamltxkzwnoci.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5Kv9_RQBbqUeOJo54ayavw_dtwaLAGy';
const LEGACY_KEY = 'balance-tracker-v1';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (id) => document.getElementById(id);

// Balance convention: positive = I owe them, negative = they owe me.
let state = { settings: { name: '', my_name: '', default_pct: null }, transactions: [] };
let user = null;

const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : NaN; };
const round2 = (n) => Math.round(n * 100) / 100;
const fmt = (n) => (n < 0 ? '−' : '') + '$' + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const fmtSigned = (n) => (n > 0 ? '+' : '') + fmt(n);
const who = () => state.settings.name || 'them';
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
const theyOwe = () => state.settings.name ? `${state.settings.name} owes me` : 'They owe me';
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const busy = (el, on) => el.classList.toggle('loading', on);

// Compute a transaction's effect on the balance from the form inputs.
function compute(t) {
  if (t.type === 'pickup') {
    const cut = t.amount * t.pct / 100;
    return { cut: round2(cut), delta: round2(t.amount - cut) };
  }
  if (t.type === 'action') {
    const share = t.result * t.pct / 100;
    // Bought: I own pct of their result → a win reduces what I owe them.
    // Sold: they own pct of my result → a win increases what I owe them.
    return { share: round2(share), delta: round2(t.side === 'bought' ? -share : share) };
  }
  return { delta: round2(t.amount * t.dir) };
}

function balance() { return round2(state.transactions.reduce((s, t) => s + Number(t.delta), 0)); }

// ----- Data -----
async function loadData() {
  busy($('appView'), true);
  const [tx, st] = await Promise.all([
    db.from('transactions').select('*').order('date', { ascending: false }).order('created_at', { ascending: false }),
    db.from('settings').select('name, my_name, default_pct').maybeSingle(),
  ]);
  busy($('appView'), false);
  if (tx.error) return alert('Could not load transactions: ' + tx.error.message);
  state.transactions = tx.data;
  if (st.data) state.settings = st.data;
  render();
  offerLegacyImport();
}

async function insertTransactions(rows) {
  const { data, error } = await db.from('transactions').insert(rows).select();
  if (error) throw error;
  return data;
}

// Old versions kept everything in localStorage; offer to upload it once.
async function offerLegacyImport() {
  let legacy;
  try { legacy = JSON.parse(localStorage.getItem(LEGACY_KEY)); } catch { return; }
  if (!legacy?.transactions?.length) return;
  if (!confirm(`Found ${legacy.transactions.length} transactions saved in this browser from before. Upload them to your account?`)) return;
  await importData(legacy);
  try { localStorage.removeItem(LEGACY_KEY); } catch {}
}

// Accepts both exports from this version and the old localStorage format.
async function importData(data) {
  const cols = ['type', 'date', 'casino', 'identity', 'amount', 'pct', 'cut', 'side', 'game', 'result', 'share', 'description', 'dir', 'delta'];
  const rows = data.transactions.map((t) => {
    const r = { ...t, description: t.description ?? t.desc };
    return Object.fromEntries(cols.filter((c) => r[c] !== undefined && r[c] !== '').map((c) => [c, r[c]]));
  });
  try {
    await insertTransactions(rows);
    const s = data.settings || {};
    const pct = s.default_pct ?? s.defaultPct;
    if (s.name || (pct !== '' && pct != null)) {
      await saveSettings({ ...state.settings, name: s.name || state.settings.name, default_pct: pct === '' ? null : pct ?? state.settings.default_pct });
    }
    await loadData();
  } catch (err) { alert('Import failed: ' + err.message); }
}

async function saveSettings(s) {
  const { error } = await db.from('settings').upsert({ user_id: user.id, ...s, updated_at: new Date().toISOString() });
  if (error) throw error;
  state.settings = s;
}

// ----- Rendering -----
function render() {
  const b = balance();
  $('balAmount').textContent = fmt(Math.abs(b));
  $('balAmount').className = 'amount ' + (b > 0 ? 'neg' : b < 0 ? 'pos' : '');
  $('balLabel').textContent = b > 0 ? `I owe ${who()}` : b < 0 ? theyOwe() : 'All square';
  $('balSub').textContent = `${state.transactions.length} transaction${state.transactions.length === 1 ? '' : 's'}`;

  const list = state.transactions;
  $('txList').innerHTML = list.length ? list.map(row).join('') : '<div class="empty">No transactions yet</div>';

  const uniq = (k) => [...new Set(state.transactions.map((t) => t[k]).filter(Boolean))];
  $('casinos').innerHTML = uniq('casino').map((c) => `<option value="${esc(c)}">`).join('');
  $('identities').innerHTML = uniq('identity').map((c) => `<option value="${esc(c)}">`).join('');
}

function row(t) {
  let title, meta;
  const delta = Number(t.delta);
  if (t.type === 'pickup') {
    title = `Pickup · ${esc(t.casino)}`;
    meta = `<span class="chip">${esc(t.identity)}</span>${fmt(Number(t.amount))} @ ${Number(t.pct)}% · my cut ${fmt(Number(t.cut))}`;
  } else if (t.type === 'action') {
    title = `Action ${t.side} · ${esc([t.casino, t.game].filter(Boolean).join(' – ') || 'no details')}`;
    meta = `Result ${fmtSigned(Number(t.result))} @ ${Number(t.pct)}%`;
  } else {
    title = esc(t.description);
    meta = t.dir > 0 ? `I owe ${esc(who())}` : esc(theyOwe());
  }
  return `<div class="tx">
    <div><div class="title">${title}</div><div class="meta">${t.date} · ${meta}</div></div>
    <div class="right"><div class="${delta > 0 ? 'neg' : delta < 0 ? 'pos' : ''}">${fmtSigned(delta)}</div>
    <button class="del" data-del="${t.id}">Delete</button></div>
  </div>`;
}

// ----- Add transaction dialog -----
let type = 'pickup', side = 'bought', dir = 1;

function segment(segId, attr, onPick) {
  $(segId).addEventListener('click', (e) => {
    const btn = e.target.closest('button'); if (!btn) return;
    $(segId).querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === btn));
    onPick(btn.dataset[attr]); updatePreview();
  });
}
segment('typeSeg', 'type', (v) => {
  type = v;
  document.querySelectorAll('[data-for]').forEach((el) => (el.hidden = el.dataset.for !== type));
});
segment('sideSeg', 'side', (v) => (side = v));
segment('dirSeg', 'dir', (v) => (dir = Number(v)));

function readForm() {
  const date = $('tDate').value || today();
  if (type === 'pickup') {
    return { type, date, casino: $('pCasino').value.trim(), identity: $('pIdentity').value.trim(), amount: num($('pAmount').value), pct: num($('pPct').value) };
  }
  if (type === 'action') {
    return { type, date, side, casino: $('aCasino').value.trim() || null, game: $('aGame').value.trim() || null, result: num($('aResult').value), pct: num($('aPct').value) };
  }
  return { type, date, description: $('gDesc').value.trim(), amount: num($('gAmount').value), dir };
}

function validate(t) {
  if (t.type === 'pickup') {
    if (!t.casino) return 'Enter a casino';
    if (!t.identity) return 'Enter an identity';
    if (!(t.amount > 0)) return 'Enter a pickup amount';
    if (!(t.pct >= 0 && t.pct <= 100)) return 'Enter my % (0–100)';
  } else if (t.type === 'action') {
    if (!Number.isFinite(t.result)) return 'Enter a result';
    if (!(t.pct >= 0 && t.pct <= 100)) return 'Enter my % (0–100)';
  } else {
    if (!t.description) return 'Enter a description';
    if (!(t.amount > 0)) return 'Enter an amount';
  }
  return null;
}

function updatePreview() {
  $('actionHint').textContent = side === 'bought'
    ? `I own my % of ${who()}'s result.`
    : `${cap(who())} owns my % of my result.`;
  const t = readForm(), err = validate(t);
  if (err) { $('preview').textContent = err; return; }
  const c = compute(t), nb = round2(balance() + c.delta);
  let line = '';
  if (t.type === 'pickup') line = `My cut ${fmt(c.cut)} · `;
  if (t.type === 'action') line = `Share ${fmtSigned(c.share)} · `;
  $('preview').innerHTML = `${line}Balance change <b>${fmtSigned(c.delta)}</b> → ${nb > 0 ? `I owe ${esc(who())}` : nb < 0 ? esc(theyOwe()) : 'square'} <b>${fmt(Math.abs(nb))}</b>`;
}
$('txForm').addEventListener('input', updatePreview);

$('addBtn').addEventListener('click', () => {
  $('txForm').reset();
  $('tDate').value = today();
  if (state.settings.default_pct != null) {
    $('pPct').value = $('aPct').value = Number(state.settings.default_pct);
  }
  updatePreview();
  $('txDlg').showModal();
});
$('cancelBtn').addEventListener('click', () => $('txDlg').close());

$('txForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const t = readForm(), err = validate(t);
  if (err) { $('preview').textContent = err; return; }
  busy($('txForm'), true);
  try {
    const start = balance();
    const [saved] = await insertTransactions([{ ...t, ...compute(t) }]);
    state.transactions.push(saved);
    state.transactions.sort((a, b) => b.date.localeCompare(a.date) || b.created_at.localeCompare(a.created_at));
    render();
    $('txDlg').close();
    showReport(saved, start);
  } catch (err) {
    $('preview').textContent = 'Save failed: ' + err.message;
  } finally {
    busy($('txForm'), false);
  }
});

$('txList').addEventListener('click', async (e) => {
  const id = e.target.dataset?.del; if (!id) return;
  if (!confirm('Delete this transaction?')) return;
  const { error } = await db.from('transactions').delete().eq('id', id);
  if (error) return alert('Delete failed: ' + error.message);
  state.transactions = state.transactions.filter((t) => t.id !== id);
  render();
});

// ----- Saved confirmation + copyable report -----
// Compact money: $300, $300.50, -$200
const money = (n) => (n < 0 ? '-' : '') + '$' + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: Number.isInteger(n) ? 0 : 2, maximumFractionDigits: 2 });
const plain = (n) => (n > 0 ? '+' : n < 0 ? '-' : '') + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 2 });
// "Josh McClain" → jm, "JM" → jm, "Mike" → m
const initials = (name) => {
  const words = name.trim().split(/\s+/).filter(Boolean);
  if (words.length > 1) return words.map((w) => w[0]).join('').toLowerCase();
  return (words[0]?.length <= 3 ? words[0] : words[0]?.[0] ?? '').toLowerCase();
};
const owes = (b) => b > 0 ? `${initials(state.settings.my_name) || 'me'} owes` : b < 0 ? `${initials(state.settings.name) || 'them'} owes` : 'even';

function report(t, start) {
  const n = (k) => Number(t[k]);
  const lines = [];
  if (t.type === 'pickup') {
    lines.push(`${t.casino} Pickup ${t.identity} ${money(n('amount'))}`);
    lines.push(`My cut: ${n('pct')}% (${money(n('cut'))})`);
  } else if (t.type === 'action') {
    lines.push([t.casino, t.game, `Action ${t.side === 'bought' ? 'Bought' : 'Sold'}`].filter(Boolean).join(' '));
    lines.push(`Result: ${plain(n('result'))} @ ${n('pct')}% = ${plain(n('share'))}`);
  } else {
    lines.push(t.description);
  }
  const end = round2(start + n('delta'));
  lines.push(`Change: ${plain(n('delta'))}`);
  lines.push(`Starting Balance: ${money(start)}`);
  lines.push(`New Balance: ${money(Math.abs(end))} (${owes(end)})`);
  return lines.join('\n');
}

function showReport(t, start) {
  $('reportText').textContent = report(t, start);
  $('copyBtn').textContent = 'Copy report';
  $('doneDlg').showModal();
}

$('copyBtn').addEventListener('click', async () => {
  const text = $('reportText').textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    // Fallback for browsers that block the async clipboard API
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
  $('copyBtn').textContent = 'Copied ✓';
});

// ----- Settings -----
$('settingsBtn').addEventListener('click', () => {
  $('sName').value = state.settings.name || '';
  $('sMyName').value = state.settings.my_name || '';
  $('sPct').value = state.settings.default_pct ?? '';
  $('setDlg').showModal();
});
$('saveSettings').addEventListener('click', async () => {
  const pct = $('sPct').value;
  try {
    await saveSettings({ name: $('sName').value.trim(), my_name: $('sMyName').value.trim(), default_pct: pct === '' ? null : num(pct) });
    render();
  } catch (err) { alert('Could not save settings: ' + err.message); }
});
$('exportBtn').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `balance-tracker-${today()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
});
$('importBtn').addEventListener('click', () => $('importFile').click());
$('importFile').addEventListener('change', async (e) => {
  const file = e.target.files[0]; if (!file) return;
  e.target.value = '';
  try {
    const data = JSON.parse(await file.text());
    if (!Array.isArray(data.transactions)) throw new Error('No transactions found');
    if (!confirm(`Add ${data.transactions.length} transactions from this file?`)) return;
    $('setDlg').close();
    await importData(data);
  } catch (err) { alert('Import failed: ' + err.message); }
});
$('signOutBtn').addEventListener('click', async () => {
  $('setDlg').close();
  await db.auth.signOut();
});

// ----- Auth -----
async function auth(kind) {
  const email = $('email').value.trim(), password = $('password').value;
  if (!email || password.length < 6) { $('authErr').textContent = 'Enter your email and a password (6+ characters)'; return; }
  $('authErr').textContent = '';
  busy($('authForm'), true);
  const { data, error } = kind === 'signup'
    ? await db.auth.signUp({ email, password, options: { emailRedirectTo: location.href.split('#')[0] } })
    : await db.auth.signInWithPassword({ email, password });
  busy($('authForm'), false);
  if (error) { $('authErr').textContent = error.message; return; }
  if (kind === 'signup' && !data.session) $('authErr').textContent = 'Check your email to confirm your account, then sign in.';
}
$('authForm').addEventListener('submit', (e) => { e.preventDefault(); auth('signin'); });
$('signUpBtn').addEventListener('click', () => auth('signup'));

db.auth.onAuthStateChange((_event, session) => {
  const next = session?.user ?? null;
  const changed = next?.id !== user?.id;
  user = next;
  $('authView').hidden = !!user;
  $('appView').hidden = !user;
  if (!changed) return;
  state = { settings: { name: '', my_name: '', default_pct: null }, transactions: [] };
  // Defer so Supabase calls don't run inside the auth callback.
  if (user) setTimeout(loadData, 0);
});
</script>
</body>
</html>
